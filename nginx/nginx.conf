# Nginx chính - chạy bằng user không đặc quyền (image nginx-unprivileged)
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Thư mục tạm đặt trong /tmp (vì container read-only)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # ---- Log truy cập dạng JSON -> Promtail/Loki parse bằng "| json"
    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
      '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
      '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
      '"host":"$host","referer":"$http_referer","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json_combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json;

    # ---- Hardening
    server_tokens off;                 # ẩn phiên bản nginx
    absolute_redirect off;             # redirect tương đối (vì cổng trong container 8443 khác cổng host 443)
    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Giới hạn tốc độ: chống brute-force trang đăng nhập & spam request
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    include /etc/nginx/conf.d/*.conf;
}

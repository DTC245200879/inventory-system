# ---------------------------------------------------------------
# 1) HTTP :8080 (host :80) -> chuyển hướng toàn bộ sang HTTPS
#    Truy cập qua cổng 80 -> https://<host>/ ; nếu máy dùng cổng
#    thay thế 8080 thì chuyển sang 8443 tương ứng.
# ---------------------------------------------------------------
map $http_host $https_host {
    default                $host;
    ~^(?<h>[^:]+):8080$    $h:8443;
}

server {
    listen 8080 default_server;
    server_name _;
    return 301 https://$https_host$request_uri;
}

# ---------------------------------------------------------------
# 2) HTTPS :8443 (host :443) - Reverse proxy
#    /             -> Web app quản lý kho (app:5000)
#    /phpmyadmin/  -> phpMyAdmin
#    /grafana/     -> Grafana (sau khi bật phần monitoring)
# ---------------------------------------------------------------
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # DNS nội bộ của Docker; dùng biến để Nginx vẫn khởi động khi
    # một upstream (vd: grafana) chưa chạy
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream     http://app:5000;
    set $pma_upstream     http://phpmyadmin:80;
    set $grafana_upstream http://grafana:3000;

    include /etc/nginx/snippets/security-headers.conf;

    # Ảnh sản phẩm tối đa 8 MB (mặc định của Nginx chỉ 1 MB); app kiểm tra lại lần nữa
    client_max_body_size 10m;

    # Không cho truy cập /metrics của app từ bên ngoài (chỉ Prometheus nội bộ)
    location = /metrics { return 404; }

    # Trang đăng nhập: rate limit chống brute-force
    location = /login {
        limit_req zone=login_limit burst=10 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $app_upstream;
    }

    location / {
        limit_req zone=general_limit burst=40 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $app_upstream;
    }

    # phpMyAdmin: bỏ tiền tố /phpmyadmin trước khi chuyển tiếp
    location /phpmyadmin/ {
        rewrite ^/phpmyadmin(/.*)$ $1 break;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $pma_upstream;
    }
    location = /phpmyadmin { return 301 /phpmyadmin/; }

    # Grafana (serve_from_sub_path=true nên giữ nguyên tiền tố /grafana)
    location /grafana/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $grafana_upstream;
    }
    location = /grafana { return 301 /grafana/; }
}

# ---------------------------------------------------------------
# 3) Cổng nội bộ :8081 - stub_status cho nginx-prometheus-exporter
#    KHÔNG publish ra host, chỉ cho phép IP mạng Docker nội bộ
# ---------------------------------------------------------------
server {
    listen 8081;
    access_log off;
    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }
    location / { return 404; }
}

# Content-Security-Policy chặt cho web app (không cho script/style inline, không cho nhúng iframe)
# Lưu ý: Nginx không kế thừa add_header từ cấp server nếu location có add_header riêng,
# nên các location dùng file này phải include lại security-headers.conf.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block public %}
<div class="login-wrap">
  <form method="post" class="card login-card">
    <h1>📦 Quản lý Kho hàng</h1>
    <p class="muted">Đăng nhập để tiếp tục</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Tên đăng nhập<input name="username" required autocomplete="username" autofocus></label>
    <label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary btn-block" type="submit">Đăng nhập</button>
  </form>
</div>
{% endblock %}

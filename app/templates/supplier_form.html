{% extends "base.html" %}
{% block title %}{{ 'Sửa' if s.id else 'Thêm' }} nhà cung cấp{% endblock %}
{% block content %}
<h1>{{ 'Sửa nhà cung cấp' if s.id else 'Thêm nhà cung cấp' }}</h1>
<form method="post" class="card form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <label>Tên nhà cung cấp *<input name="name" value="{{ s.name or '' }}" required maxlength="150"></label>
    <label>Điện thoại<input name="phone" value="{{ s.phone or '' }}" maxlength="30"></label>
    <label>Email<input name="email" type="email" value="{{ s.email or '' }}" maxlength="120"></label>
    <label>Địa chỉ<input name="address" value="{{ s.address or '' }}" maxlength="255"></label>
  </div>
  <div class="form-actions">
    <a class="btn" href="{{ url_for('suppliers') }}">Huỷ</a>
    <button class="btn btn-primary" type="submit">Lưu</button>
  </div>
</form>
{% endblock %}

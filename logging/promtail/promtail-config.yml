server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          # chỉ lấy log của các container thuộc project "inventory"
          - name: label
            values: ["com.docker.compose.project=inventory"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container            # vd: inventory-app
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service              # vd: app, nginx, db
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream               # stdout / stderr
    pipeline_stages:
      # Gắn nhãn level cho log của web app (định dạng logfmt: level=info event=...)
      - match:
          selector: '{service="app"}'
          stages:
            - logfmt:
                mapping:
                  level:
            - labels:
                level:
      # Gắn nhãn status_class (2xx/4xx/5xx) cho access log JSON của Nginx
      - match:
          selector: '{service="nginx"}'
          stages:
            - regex:
                expression: '"status":(?P<status_class>\d)\d\d'
            - template:
                source: status_class
                template: '{{ if .Value }}{{ .Value }}xx{{ end }}'
            - labels:
                status_class:
